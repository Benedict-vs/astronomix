# Software versions and the astronomix commit of every run that Paper I uses (asgard-papers #19).
# Read by paper1_numbers.py and written to the manifest as the top-level `software_versions` block;
# short commits are expanded there and must exist in the repository.
#
# Sources: the environment header and "commit:" / "code copy of:" lines of the HoreKa job logs
# (cgols_logs/horeka/), the start lines of the local run logs (cgols_logs/aprod_local.log,
# gpu2_runs.log, c512_sweep.log, ~/.gpuq/*/gpuq.log), the launch commands in the Claude session
# transcripts and the git reflogs of the checkouts (reconstruction of 23 Nov 2026).
# confidence: certain = commit logged at launch or checkout state at launch read back;
# likely = reported second-hand (JUPITER) or inferred from timestamps.
#
# All commits are on main of the fork. Between them the finite-difference hydro solver used by
# models A and C is unchanged; the commits differ by opt-in additions (model C cluster options,
# FV reconstruction and sharding, cooling, MHD, in-situ emission maps, float64 mode).

jax: 0.10.1
jaxlib: 0.10.1
cuda: "12.9 (nvcc 12.9.86)"
python: "3.12 (HoreKa, local GPU server); 3.13 (JUPITER)"
orbax_checkpoint: 0.12.1
astronomix_package_version: 0.6.6
astronomix_repository: https://github.com/Benedict-vs/astronomix
astronomix_release: null  # no Zenodo release contains these commits yet (latest: alpha, 10.5281/zenodo.17782162)

# Labels used in the manifest that are not single runs of ours.
not_runs:
  - all
  - "CGOLS I 2048^3 (public)"
  - "FD/FV 128-2048"

runs:
  A-128: {commit: d9a2d47, machine: local, evidence: "aprod_local.log 10-21 11:55 start (d9a2d47)", confidence: certain}
